<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #e8f4ff;
            text-align: center;
            margin: 0;
            min-height: 100vh;
            padding: 60px 20px;
        }

        .container {
            width: 400px;
            max-width: 100%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px gray;
        }

        h1, h2 { margin-top: 0; }

        .search-row {
            display: flex;
            gap: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #333;
            color: white;
            font-weight: bold;
        }

        button:hover { opacity: 0.9; }

        button:focus, input:focus {
            outline: 2px solid #4d90fe;
            outline-offset: 2px;
        }

        #weather { margin-top: 25px; }

        #temperature {
            font-size: 40px;
            font-weight: bold;
            margin: 12px 0;
        }

        #error {
            color: #c62828;
            min-height: 20px;
        }

        #loading {
            display: none;
            color: #555;
        }

        img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        @media (max-width: 450px) {
            body { padding: 30px 15px; }
            .container { padding: 22px; }
            .search-row { flex-direction: column; }
            button { width: 100%; }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Weather App</h1>

        <form id="weatherForm" class="search-row">
            <label for="city" hidden>City</label>
            <input type="text" id="city" placeholder="Enter city" autocomplete="off">
            <button type="submit">Search</button>
        </form>

        <p id="loading" aria-live="polite">Loading weather...</p>
        <p id="error" role="alert"></p>
        <section id="weather" aria-live="polite"></section>
    </main>

    <script>
        const apiKey = "11b207444ba9c836e3ca49db09459e57";
        const form = document.getElementById("weatherForm");
        const cityInput = document.getElementById("city");
        const weather = document.getElementById("weather");
        const error = document.getElementById("error");
        const loading = document.getElementById("loading");

        form.addEventListener("submit", function(event) {
            event.preventDefault();
            getWeather();
        });

        async function getWeather() {
            const city = cityInput.value.trim();

            if (!city) {
                error.textContent = "Please enter a city.";
                weather.innerHTML = "";
                cityInput.focus();
                return;
            }

            error.textContent = "";
            weather.innerHTML = "";
            loading.style.display = "block";

            try {
                const url =
                    "https://api.weatherstack.com/current?access_key=" +
                    apiKey +
                    "&query=" +
                    encodeURIComponent(city) +
                    "&units=m";

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("Weather service is unavailable.");
                }

                const data = await response.json();

                if (data.error) {
                    error.textContent = data.error.info || "Unable to find that city.";
                    return;
                }

                showWeather(data);
            } catch (err) {
                error.textContent = "Unable to fetch weather data. Please try again.";
            } finally {
                loading.style.display = "none";
            }
        }

        function showWeather(data) {
            const location = data.location;
            const current = data.current;

            weather.innerHTML = `
                <h2>${escapeHtml(location.name)}, ${escapeHtml(location.country)}</h2>
                <img src="${escapeHtml(current.weather_icons[0])}" alt="Weather icon">
                <p id="temperature">${current.temperature} °C</p>
                <p>Condition: ${escapeHtml(current.weather_descriptions[0])}</p>
                <p>Humidity: ${current.humidity}%</p>
                <p>Wind Speed: ${current.wind_speed} km/h</p>
            `;
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }
    </script>
</body>
</html>
